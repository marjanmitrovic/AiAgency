name: Add Digital Growth link

on:
  push:
    paths:
      - '.github/workflows/add-digital-growth-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add link without changing the existing page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'href="digital-growth.html"' not in text:
              nav = '        <a href="#services" data-i18n="nav_services">Services</a>'
              replacement = nav + '\n        <a href="digital-growth.html" data-i18n="nav_digital_growth">Digital Growth</a>'
              if nav not in text:
                  raise SystemExit('Navigation anchor was not found; index.html was not changed.')
              text = text.replace(nav, replacement, 1)

          translations = {
              '        nav_services: "Services",': '        nav_services: "Services",\n        nav_digital_growth: "Digital Growth",',
              '        nav_services: "Usluge",': '        nav_services: "Usluge",\n        nav_digital_growth: "Digitalni rast",',
              '        nav_services: "Služby",': '        nav_services: "Služby",\n        nav_digital_growth: "Digitální růst",',
          }
          if 'nav_digital_growth:' not in text:
              for old, new in translations.items():
                  if old not in text:
                      raise SystemExit(f'Translation anchor not found: {old}')
                  text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit minimal change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-digital-growth-link.yml
          git add index.html
          git commit -m "Link main agency site to Digital Growth page"
          git push
