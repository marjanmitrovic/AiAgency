name: Remove AI audit card
on:
  push:
    paths:
      - '.github/workflows/remove-ai-audit-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove AI audit card section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new=re.sub(r'\n\s*<section id="ai-audit-card".*?</section>\s*\n', '\n', s, count=1, flags=re.S)
          if new==s:
              print('AI audit card not found')
              raise SystemExit(0)
          p.write_text(new,encoding='utf-8')
          print('Removed AI audit card')
          PY
      - name: Commit homepage update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove AI audit card from homepage"
          git push
